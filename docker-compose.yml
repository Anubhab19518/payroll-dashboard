services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: nextjs_production_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app-dev:
    image: node:22-alpine
    container_name: nextjs_dev_app
    working_dir: /app
    ports:
      - '3001:3000'
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
    command: sh -c "corepack enable && corepack prepare pnpm@10.16.0 --activate && pnpm install && pnpm dev"
    profiles:
      - dev
